<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unidades de Medida - Nutri IFTM</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body class="main-layout">

<div th:replace="~{menu :: menu}"></div>

<div class="container mt-5">

    <h1>Unidades de Medida</h1>

    <div class="mb-3">
        <a th:href="@{/unidades/inserir}" class="btn btn-success">Nova Unidade de Medida</a>
    </div>

    <table class="table table-striped table-bordered align-middle">
        <thead class="table-dark">
        <tr>
            <th>#</th>
            <th>Nome</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${unidades}">
            <td th:text="${u.undCodigo}"></td>
            <td th:text="${u.undNome}"></td>
            <td>
                <a th:href="@{/unidades/alterar/{id}(id=${u.undCodigo})}" class="btn btn-warning btn-sm">Alterar</a>
                <a th:href="@{/unidades/remover/{id}(id=${u.undCodigo})}" class="btn btn-danger btn-sm">Remover</a>
            </td>
        </tr>
        <tr th:if="${unidades == null or #lists.isEmpty(unidades)}">
            <td colspan="3">Nenhuma unidade de medida cadastrada ainda.</td>
        </tr>
        </tbody>
    </table>
</div>

<footer><div th:replace="~{rodape :: rodape}"></div></footer>

<script th:src="@{/js/jquery.min.js}"></script>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
