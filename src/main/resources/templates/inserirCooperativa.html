<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nutri - IFTM</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" th:href="@{/css/jquery.mCustomScrollbar.min.css}">
</head>
<body class="main-layout">

<div th:replace="~{menu :: menu}"></div>

<div class="container mt-5">

    <h1>Cadastro de Cooperativa</h1>

    <form th:action="@{/cooperativas/salvar}" method="post" class="needs-validation" novalidate>

        <div class="mb-3">
            <label class="form-label">Nome da Cooperativa *</label>
            <input type="text"
                   name="cooNome"
                   class="form-control"
                   placeholder="Ex: Cooperativa Frutos do Cerrado"
                   required>
            <div class="invalid-feedback">
                Por favor, informe o nome da cooperativa.
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Endereço</label>
            <input type="text"
                   name="cooEndereco"
                   class="form-control"
                   placeholder="Ex: Rua Principal, 45 – Centro">
        </div>

        <div class="mb-3">
            <label class="form-label">CNPJ</label>
            <input type="text"
                   name="cooCNPJ"
                   class="form-control"
                   placeholder="00.000.000/0001-00">
            <div class="form-text">Digite apenas números ou no formato 00.000.000/0001-00.</div>
        </div>

        <div class="mb-3">
            <label class="form-label">Cidade</label>
            <input type="text"
                   name="cooCidade"
                   class="form-control"
                   placeholder="Ex: Uberlândia">
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-success">Cadastrar Cooperativa</button>
            <a th:href="@{/cooperativas}" class="btn btn-secondary ms-2">Voltar</a>
        </div>

    </form>
</div>

<footer><div th:replace="~{rodape :: rodape}"></div></footer>

<script th:src="@{/js/jquery.min.js}"></script>
<script th:src="@{/js/popper.min.js}"></script>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/jquery.mCustomScrollbar.concat.min.js}"></script>
<script th:src="@{/js/custom.js}"></script>
<script>
(function () {
    'use strict';
    document.querySelectorAll('form.needs-validation').forEach(function (form) {
        form.addEventListener('submit', function (event) {
            if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
            }
            form.classList.add('was-validated');
        }, false);
    });
})();
</script>
</body>
</html>
