<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta — Nutri IFTM</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500;600;700&display=swap');

    body { margin: 0; }
    .nutri-cad-wrap {
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      background: #14100e;
      font-family: 'Inter', sans-serif;
      padding: 40px 20px;
    }
    .nutri-cad-inner { width: 100%; max-width: 380px; }
    .nutri-cad-title {
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      font-size: 30px;
      text-align: center;
      margin: 0 0 30px;
      color: #f5f2ea;
    }
    .nutri-cad-field-group { margin-bottom: 20px; }
    .nutri-cad-label {
      display: block;
      font-size: 13.5px;
      font-weight: 700;
      color: #6b9331;
      margin-bottom: 9px;
    }
    .nutri-cad-input-wrap {
      background: #f1f8e9;
      border-radius: 10px;
      border: 1.5px solid transparent;
    }
    .nutri-cad-input-wrap:focus-within {
      border-color: #8fb02e;
      box-shadow: 0 0 0 3px rgba(143,176,46,0.22);
    }
    .nutri-cad-input-wrap input {
      width: 100%;
      box-sizing: border-box;
      border: none;
      background: transparent;
      outline: none;
      padding: 13px 14px;
      font-family: 'Inter', sans-serif;
      font-size: 14.5px;
      color: #2b2a1f;
    }
    .nutri-cad-submit {
      width: 100%;
      margin-top: 10px;
      padding: 15px 18px;
      border: none;
      border-radius: 999px;
      background: #76b82a;
      color: #12140a;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }
    .nutri-cad-submit:hover { filter: brightness(1.06); }
    .nutri-cad-helper {
      margin-top: 18px;
      text-align: center;
      font-size: 13px;
      color: #f5f2ea;
      font-weight: 600;
    }
    .nutri-cad-helper a { color: #87ab52; font-weight: 700; text-decoration: none; }
    .nutri-cad-helper a:hover { text-decoration: underline; }
    .nutri-cad-erro {
      background: #3a1414;
      border: 1px solid #7a2b2b;
      color: #f5c6c6;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13.5px;
      margin-bottom: 18px;
      display: none;
    }
  </style>
</head>
<body>

<div class="nutri-cad-wrap">
  <div class="nutri-cad-inner">
    <h1 class="nutri-cad-title">Criar Conta</h1>

    <div id="erroMsg" class="nutri-cad-erro"></div>

    <form id="formCadastro">
      <div class="nutri-cad-field-group">
        <label for="nome" class="nutri-cad-label">Nome</label>
        <div class="nutri-cad-input-wrap">
          <input id="nome" name="nome" type="text" placeholder="Seu nome" required/>
        </div>
      </div>

      <div class="nutri-cad-field-group">
        <label for="email" class="nutri-cad-label">Email</label>
        <div class="nutri-cad-input-wrap">
          <input id="email" name="email" type="email" placeholder="exemplo@exemplo.com" required/>
        </div>
      </div>

      <div class="nutri-cad-field-group">
        <label for="senha" class="nutri-cad-label">Senha</label>
        <div class="nutri-cad-input-wrap">
          <input id="senha" name="senha" type="password" placeholder="mínimo 6 caracteres" minlength="6" required/>
        </div>
      </div>

      <div class="nutri-cad-field-group">
        <label for="confirmarSenha" class="nutri-cad-label">Confirmar senha</label>
        <div class="nutri-cad-input-wrap">
          <input id="confirmarSenha" name="confirmarSenha" type="password" placeholder="repita a senha" minlength="6" required/>
        </div>
      </div>

      <button type="submit" class="nutri-cad-submit">criar conta</button>
    </form>

    <p class="nutri-cad-helper">Já tem uma conta? <a th:href="@{/login}">entrar</a></p>
  </div>
</div>

<script type="module" th:inline="javascript">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth, createUserWithEmailAndPassword, updateProfile
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: /*[[${firebaseWeb.apiKey}]]*/ "",
    authDomain: /*[[${firebaseWeb.authDomain}]]*/ "",
    projectId: /*[[${firebaseWeb.projectId}]]*/ "",
    storageBucket: /*[[${firebaseWeb.storageBucket}]]*/ "",
    messagingSenderId: /*[[${firebaseWeb.messagingSenderId}]]*/ "",
    appId: /*[[${firebaseWeb.appId}]]*/ ""
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const erroMsg = document.getElementById("erroMsg");

  function mostrarErro(texto) {
    erroMsg.textContent = texto;
    erroMsg.style.display = "block";
  }

  document.getElementById("formCadastro").addEventListener("submit", async (e) => {
    e.preventDefault();
    erroMsg.style.display = "none";

    const nome = document.getElementById("nome").value;
    const email = document.getElementById("email").value;
    const senha = document.getElementById("senha").value;
    const confirmarSenha = document.getElementById("confirmarSenha").value;

    if (senha !== confirmarSenha) {
      mostrarErro("As senhas não coincidem.");
      return;
    }

    try {
      const cred = await createUserWithEmailAndPassword(auth, email, senha);
      await updateProfile(cred.user, { displayName: nome });

      // Pega um token novo já com o displayName atualizado
      const token = await cred.user.getIdToken(true);

      const resp = await fetch("/auth/sessao", {
        method: "POST",
        headers: { "Authorization": "Bearer " + token }
      });

      if (resp.ok) {
        window.location.href = "/";
      } else {
        mostrarErro("Conta criada, mas falhou ao autenticar no servidor. Tente entrar normalmente.");
      }
    } catch (err) {
      mostrarErro(traduzErro(err.code) || err.message);
    }
  });

  function traduzErro(codigo) {
    switch (codigo) {
      case "auth/email-already-in-use": return "Este email já está cadastrado.";
      case "auth/invalid-email": return "Email inválido.";
      case "auth/weak-password": return "Senha muito fraca (mínimo 6 caracteres).";
      default: return null;
    }
  }
</script>

</body>
</html>
