<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nova Unidade de Medida - Nutri IFTM</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body class="main-layout">

<div th:replace="~{menu :: menu}"></div>

<div class="container mt-5">

    <h1>Nova Unidade de Medida</h1>

    <form th:action="@{/unidades/salvar}" th:object="${unidade}" method="post"
          class="needs-validation" novalidate>

        <div class="mb-3">
            <label class="form-label">Nome *</label>
            <input type="text"
                   th:field="*{undNome}"
                   class="form-control"
                   placeholder="Ex: g, ml, colher de sopa"
                   required>
            <div class="invalid-feedback">
                Por favor, informe o nome da unidade de medida.
            </div>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-success">Cadastrar</button>
            <a th:href="@{/unidades}" class="btn btn-secondary ms-2">Voltar</a>
        </div>

    </form>
</div>

<footer><div th:replace="~{rodape :: rodape}"></div></footer>

<script th:src="@{/js/jquery.min.js}"></script>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script>
(function () {
    'use strict';
    document.querySelectorAll('form.needs-validation').forEach(function (form) {
        form.addEventListener('submit', function (event) {
            if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
            }
            form.classList.add('was-validated');
        }, false);
    });
})();
</script>
</body>
</html>
