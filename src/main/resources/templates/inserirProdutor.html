<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutri - IFTM</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" th:href="@{/css/jquery.mCustomScrollbar.min.css}">
</head>
<body class="main-layout">

    <div class="loader_bg">
        <div class="loader"><img th:src="@{/images/loading.gif}" alt="#"></div>
    </div>

    <div th:replace="~{menu :: menu}"></div>

    <div th:if="${mensagem != null}">
        <script th:inline="javascript">alert([[${mensagem}]]);</script>
    </div>

    <div class="three_box">
        <div class="container">
            <div class="row">
                <div class="col-md-12">
                    <br><br><br><br>
                    <div class="box_text">

                        <h1>Cadastro de Produtor</h1>

                        <form th:action="@{/produtores/salvar}" method="post" class="needs-validation" novalidate>

                            <div class="mb-3">
                                <label class="form-label">Nome do Produtor *</label>
                                <input type="text"
                                       name="fabNome"
                                       class="form-control"
                                       placeholder="Ex: João da Silva"
                                       required>
                                <div class="invalid-feedback">
                                    Por favor, informe o nome do produtor.
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Endereço *</label>
                                <input type="text"
                                       name="fabEndereco"
                                       class="form-control"
                                       placeholder="Ex: Rua das Flores, 123 – Zona Rural"
                                       required>
                                <div class="invalid-feedback">
                                    Por favor, informe o endereço do produtor.
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Contato *</label>
                                <input type="text"
                                       name="fabContato"
                                       class="form-control"
                                       placeholder="Ex: (34) 99999-0000"
                                       required>
                                <div class="invalid-feedback">
                                    Por favor, informe um contato (telefone ou e-mail).
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Cooperativa *</label>
                                <select name="cooperativa.cooCodigo" class="form-control" required>
                                    <option value="">Selecione a cooperativa</option>
                                    <option th:each="c : ${cooperativas}"
                                            th:value="${c.cooCodigo}"
                                            th:text="${c.cooNome}">
                                    </option>
                                </select>
                                <div class="invalid-feedback">
                                    Por favor, selecione a cooperativa do produtor.
                                </div>
                            </div>

                            <div class="mt-4">
                                <button type="submit" class="btn btn-success">Confirmar Cadastro</button>
                                <a href="/produtores" class="btn btn-secondary ms-2">Voltar</a>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer><div th:replace="~{rodape :: rodape}"></div></footer>

    <script th:src="@{/js/jquery.min.js}"></script>
    <script th:src="@{/js/popper.min.js}"></script>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/jquery-3.0.0.min.js}"></script>
    <script th:src="@{/js/jquery.mCustomScrollbar.concat.min.js}"></script>
    <script th:src="@{/js/custom.js}"></script>
    <script>
    (function () {
        'use strict';
        document.querySelectorAll('form.needs-validation').forEach(function (form) {
            form.addEventListener('submit', function (event) {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });
    })();
    </script>
</body>
</html>
