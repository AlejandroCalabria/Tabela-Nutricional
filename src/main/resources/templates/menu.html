<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<body>

<!-- ======================================================
     FRAGMENT: menu
     Uso nas páginas: th:replace="~{fragments/menu :: menu}"
     ====================================================== -->
<section th:fragment="menu">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');

    .nutri-nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: 80px;
      background: #ffffff;
      border-bottom: 1px solid rgba(61,122,34,0.12);
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
      font-family: 'Inter', sans-serif;
      margin-bottom: 24px;
    }

    /* LOGO */
    .nutri-nav .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      flex-shrink: 0;
    }
    .nutri-nav .nav-logo-text {
      font-family: 'Quicksand', sans-serif;
      font-weight: 600;
      font-size: 20px;
      color: #1A1512;
      letter-spacing: -0.01em;
    }

    /* CENTRO */
    .nutri-nav .nav-center {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Links diretos */
    .nutri-nav .nav-link {
      font-size: 14.5px;
      font-weight: 500;
      color: #3a3a3a;
      text-decoration: none;
      padding: 9px 14px;
      border-radius: 8px;
      transition: color .15s, background .15s;
      font-family: 'Inter', sans-serif;
    }
    .nutri-nav .nav-link:hover {
      background: rgba(61,122,34,0.07);
      color: #2d5e1a;
    }

    /* Botão Gerenciar */
    .nutri-nav .manage-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #2d5e1a;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 16px;
      font-family: 'Inter', sans-serif;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background .18s;
    }
    .nutri-nav .manage-btn:hover { background: #3D7A22; }
    .nutri-nav .manage-btn svg {
      transition: transform .22s;
    }
    .nutri-nav .manage-btn.open svg {
      transform: rotate(180deg);
    }

    /* Dropdowns */
    .nutri-nav .dropdown-wrap {
      position: relative;
    }
    .nutri-nav .dropdown-menu {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      min-width: 210px;
      background: #fff;
      border: 1px solid rgba(61,122,34,0.14);
      border-radius: 14px;
      padding: 8px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.13);
      z-index: 999;
    }
    .nutri-nav .dropdown-menu.open {
      display: block;
    }
    .nutri-nav .dropdown-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 9px;
      text-decoration: none;
      color: #1A1512;
      font-size: 14px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      transition: background .15s;
    }
    .nutri-nav .dropdown-item:hover {
      background: rgba(129,182,34,0.12);
    }
    .nutri-nav .dropdown-item .item-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: rgba(129,182,34,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Avatar */
    .nutri-nav .avatar-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #e8ede4;
      border: 2px solid rgba(61,122,34,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color .18s;
      flex-shrink: 0;
      padding: 0;
      overflow: hidden;
    }
    .nutri-nav .avatar-btn:hover {
      border-color: #3D7A22;
    }

    /* Dropdown do usuário (alinhado à direita) */
    .nutri-nav .user-dropdown {
      left: auto;
      right: 0;
      min-width: 190px;
    }
    .nutri-nav .dropdown-divider {
      height: 1px;
      background: rgba(0,0,0,0.08);
      margin: 6px 4px;
    }
    .nutri-nav .dropdown-item-user {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 9px;
      text-decoration: none;
      color: #1A1512;
      font-size: 14px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      transition: background .15s;
    }
    .nutri-nav .dropdown-item-user:hover {
      background: rgba(0,0,0,0.04);
    }
    .nutri-nav .dropdown-item-logout {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 9px;
      text-decoration: none;
      color: #c0392b;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      background: rgba(192,57,43,0.08);
      transition: background .15s;
    }
    .nutri-nav .dropdown-item-logout:hover {
      background: rgba(192,57,43,0.16);
    }

    /* Botão "Entrar" (estado deslogado) */
    .nutri-nav .nav-entrar-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #2d5e1a;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      padding: 9px 18px;
      font-family: 'Inter', sans-serif;
      font-size: 14.5px;
      font-weight: 600;
      transition: background .18s;
      flex-shrink: 0;
    }
    .nutri-nav .nav-entrar-btn:hover { background: #3D7A22; }

    /* Cabeçalho com nome/email no dropdown do usuário */
    .nutri-nav .dropdown-user-header {
      padding: 8px 12px 10px;
    }
    .nutri-nav .dropdown-user-nome {
      font-size: 14px;
      font-weight: 700;
      color: #1A1512;
      font-family: 'Inter', sans-serif;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .nutri-nav .dropdown-user-email {
      font-size: 12px;
      color: #767676;
      font-family: 'Inter', sans-serif;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>

  <nav class="nutri-nav">

    <!-- ── LOGO ── -->
    <a th:href="@{/}" class="nav-logo">
      <img width="70" height="70" viewBox="0 0 70 70" fill="none" src="/images/logo.png"/>
      <span class="nav-logo-text">IFTM Nutri</span>
    </a>

    <!-- ── CENTRO ── -->
    <div class="nav-center">

      <!-- Dropdown Gerenciar -->
      <div class="dropdown-wrap" id="manageWrap">
        <button class="manage-btn" id="manageBtn" onclick="nutriToggle('manageMenu', 'manageBtn')">
          Gerenciar
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>

        <div class="dropdown-menu" id="manageMenu">
          <a th:href="@{/produtos}" class="dropdown-item">
            <span class="item-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                   stroke="#3D7A22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7" rx="1"/>
                <rect x="14" y="3" width="7" height="7" rx="1"/>
                <rect x="3" y="14" width="7" height="7" rx="1"/>
                <rect x="14" y="14" width="7" height="7" rx="1"/>
              </svg>
            </span>
            Produtos
          </a>
          <a th:href="@{/produtores}" class="dropdown-item">
            <span class="item-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                   stroke="#3D7A22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20v-1a8 8 0 0 1 16 0v1"/>
              </svg>
            </span>
            Produtores
          </a>
          <a th:href="@{/nutrientes}" class="dropdown-item">
            <span class="item-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                   stroke="#3D7A22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
              </svg>
            </span>
            Nutrientes
          </a>
        </div>
      </div>

      <!-- Links diretos -->
      <a th:href="@{/tabela}" class="nav-link">Tabelas Nutricionais</a>
      <a th:href="@{/calculadora}" class="nav-link">Calculadora Nutricional (TACO)</a>
      <a th:href="@{/ingredientes/consulta}" class="nav-link">Consultar Ingrediente</a>
      <a th:href="@{/tabela}" class="nav-link">Gerenciar Rótulos</a>

    </div>

    <!-- ── LOGADO: avatar + dropdown usuário ── -->
    <div class="dropdown-wrap" id="userWrap" th:if="${usuarioLogado != null}">
      <button class="avatar-btn" id="userBtn" onclick="nutriToggle('userMenu', 'userBtn')">
        <img th:src="${usuarioLogado.fotoUrl} ?: @{/images/avatar.png}"
             src="/images/avatar.png"
             style="width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;"/>
      </button>

      <div class="dropdown-menu user-dropdown" id="userMenu">
        <div class="dropdown-user-header">
          <div class="dropdown-user-nome" th:text="${usuarioLogado.nome} ?: ${usuarioLogado.email}">Nome</div>
          <div class="dropdown-user-email" th:text="${usuarioLogado.email}">email@exemplo.com</div>
        </div>
        <div class="dropdown-divider"></div>

        <a th:href="@{/tabela}" class="dropdown-item-user">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
               stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <path d="M3 9h18M9 21V9"/>
          </svg>
          Meus Rótulos
        </a>
        <a href="#" class="dropdown-item-user">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
               stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
          Perfil
        </a>
        <a th:href="@{/recuperar-senha}" class="dropdown-item-user">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
               stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/>
          </svg>
          Alterar senha
        </a>
        <div class="dropdown-divider"></div>
        <a href="#" id="logoutBtn" class="dropdown-item-logout">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
               stroke="#c0392b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Logout
        </a>
      </div>
    </div>

    <!-- ── DESLOGADO: botão Entrar ── -->
    <a th:if="${usuarioLogado == null}" th:href="@{/login}" class="nav-entrar-btn">Entrar</a>

  </nav>

  <script>
    function nutriToggle(menuId, btnId) {
      const clickedMenu = document.getElementById(menuId);
      const isOpen = clickedMenu.classList.contains('open');

      // Fecha todos
      document.querySelectorAll('.nutri-nav .dropdown-menu').forEach(m => m.classList.remove('open'));
      document.querySelectorAll('.nutri-nav .manage-btn').forEach(b => b.classList.remove('open'));

      // Abre o clicado se estava fechado
      if (!isOpen) {
        clickedMenu.classList.add('open');
        if (btnId === 'manageBtn') {
          document.getElementById('manageBtn').classList.add('open');
        }
      }
    }

    // Fecha ao clicar fora
    document.addEventListener('click', function(e) {
      if (!e.target.closest('#manageWrap') && !e.target.closest('#userWrap')) {
        document.querySelectorAll('.nutri-nav .dropdown-menu').forEach(m => m.classList.remove('open'));
        document.querySelectorAll('.nutri-nav .manage-btn').forEach(b => b.classList.remove('open'));
      }
    });

    // Logout: encerra a sessão no servidor e manda de volta pro login.
    // Só existe quando o usuário está logado (avatar renderizado).
    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', async function(e) {
        e.preventDefault();
        try {
          await fetch('/auth/logout', { method: 'POST' });
        } finally {
          window.location.href = '/login';
        }
      });
    }
  </script>

</section>
<!-- ── fim do fragment menu ── -->

</body>
</html>
